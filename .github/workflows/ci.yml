name: CI

on:
  push:
    branches: [main, 'feat/*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - name: Install dependencies
        run: uv sync --locked --group dev
      - name: Ruff check
        run: uv run ruff check src/ tests/
      - name: Ruff format check
        run: uv run ruff format --check src/ tests/

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - name: Install dependencies
        run: uv sync --locked --group dev
      - name: Run tests
        run: uv run pytest tests/ -x -q --tb=short

  visual-proof:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - name: Install dependencies
        run: uv sync --locked --group dev
      - name: Install Persian-capable fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-core fonts-noto-extra
      - name: Install Chromium
        run: uv run playwright install --with-deps chromium
      - name: Render production design proof
        run: uv run python scripts/render-design-proof.py
      - name: Upload design proof
        uses: actions/upload-artifact@v4
        with:
          name: graphics-engine-v2-design-proof
          path: artifacts/design-proof/
          if-no-files-found: error
          retention-days: 14
