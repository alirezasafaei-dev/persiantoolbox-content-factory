[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ptb-content-factory"
version = "1.1.0"
description = "PersianToolbox Content Factory — deterministic social media content pipeline"
readme = "README.fa.md"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
authors = [
    {name = "PersianToolbox Team"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "playwright>=1.40",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "jsonschema>=4.20",
    "httpx>=0.27",
    "click>=8.1",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.12",
    "mypy>=1.10",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.12",
    "mypy>=1.10",
]

[project.scripts]
ptb-content = "ptb_content.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ptb_content"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "A", "C4", "PT", "RUF"]
ignore = [
    "S603", "S607", "B008", "E501", "UP042", "S101",
    "RUF001", "RUF003", "RUF012", "RUF022", "RUF034", "RUF059",
    "S311", "S105", "S110", "S608",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
